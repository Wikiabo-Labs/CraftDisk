[package]
name = "diskcraft"
version = "0.1.1"
edition = "2021"
description = "DiskCraft - gestionnaire de disques et de partitions libre et gratuit"
license = "GPL-3.0-or-later"
build = "build.rs"

[[bin]]
name = "DiskCraft"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.29.1", default-features = false, features = ["default_fonts", "glow"] }
egui = "=0.29.1"
image = { version = "0.25", default-features = false, features = ["png"] }
resvg = { version = "0.45", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_IO", "Win32_System_Threading"] }

[build-dependencies]
resvg = { version = "0.45", default-features = false }

[patch.crates-io]
webbrowser = { path = "vendor/webbrowser" }

[profile.release]
opt-level = 3
